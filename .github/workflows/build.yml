name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]      # test build only, no release
    tags: ['v*']          # release
jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Restore signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "DEBUG_KEYSTORE_B64 secret is missing"; exit 1; }
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore

      - name: Cache Android tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i -E "s/^version *=.*/version = ${GITHUB_REF_NAME#v}/" buildozer.spec

      - name: Stamp version
        id: ver
        run: |
          V=$(grep -E '^version *=' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          echo "__version__ = \"$V\"" > _version.py
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Android-apk
          path: bin/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Numeracy Drill ${{ steps.ver.outputs.v }}
          files: bin/*.apk
