name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]      # test build only, no release
    tags: ['v*']          # release
jobs:
  android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer "cython==0.29.36" virtualenv setuptools

      - name: Cache Android tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i -E "s/^version *=.*/version = ${GITHUB_REF_NAME#v}/" buildozer.spec

      - name: Stamp version
        id: ver
        run: |
          V=$(grep -E '^version *=' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          echo "__version__ = \"$V\"" > _version.py
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Set version code
        run: |
          V=$(grep -E '^version *=' buildozer.spec | head -1 | cut -d= -f2 | tr -d ' ')
          IFS=. read MAJ MIN PAT <<< "$V"
          CODE=$((MAJ*10000 + MIN*100 + PAT))
          sed -i '/^android.numeric_version/d' buildozer.spec
          sed -i "/^version *=/a android.numeric_version = $CODE" buildozer.spec
          echo "Version $V -> code $CODE"

      - name: Build release APK
        run: buildozer -v android release

      - name: Sign APK
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KS" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls bin/*-release-unsigned.apk)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "bin/gnhsnumeracy-${{ steps.ver.outputs.v }}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "bin/gnhsnumeracy-${{ steps.ver.outputs.v }}.apk"
          rm "$UNSIGNED" "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: Android-apk
          path: bin/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Numeracy Drill ${{ steps.ver.outputs.v }}
          files: bin/*.apk
